# Generate the Xcode project with:  xcodegen generate
name: EasyTalk
options:
  bundleIdPrefix: com.edmondxu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.4"          # marks the project as up to date for this Xcode
settings:
  base:
    DEVELOPMENT_TEAM: D2B754BN62   # personal team (project level, targets inherit it)
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  EasyTalk:
    type: application
    platform: iOS
    sources: [EasyTalk]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edmondxu.easytalk
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: EasyTalk/Info.plist
      properties:
        CFBundleDisplayName: EasyTalk
        NSMicrophoneUsageDescription: EasyTalk 需要使用麦克风，实时转写和翻译你听到的英语。
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
