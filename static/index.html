<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EasyTalk">
<title>EasyTalk</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
</head>
<body>
<div id="login" class="screen hidden">
  <div class="login-box">
    <img class="login-logo" src="/static/logo-64.png" width="72" height="72" alt="">
    <h1>EasyTalk</h1>
    <p class="muted">英语对话助手</p>
    <form id="login-form">
      <input id="passcode" type="password" autocomplete="current-password" placeholder="访问口令" required>
      <button type="submit" class="primary">进入</button>
    </form>
    <p id="login-error" class="error"></p>
  </div>
</div>

<div id="app" class="screen hidden">
  <header>
    <div class="brand"><img src="/static/logo-64.png" width="26" height="26" alt="">EasyTalk</div>
    <div class="modes" role="tablist">
      <button data-mode="chat" role="tab">对话</button>
      <button data-mode="lecture" role="tab">会议演讲</button>
    </div>
    <button id="topic" class="topic hidden" title="会议主题">主题</button>
    <select id="scene" aria-label="场景">
      <option value="work">工作</option>
      <option value="hospital">医院</option>
      <option value="school">学校</option>
      <option value="shop">购物</option>
      <option value="phone">电话</option>
      <option value="daily">日常</option>
    </select>
    <div id="status" class="status"><span class="dot"></span><span id="status-text">未开始</span></div>
  </header>

  <main id="transcript" aria-live="polite">
    <div id="empty-hint" class="hint">
      <p><b>点下方「开始」</b>，把手机放在你和对方之间。</p>
      <p>对方说的话会显示英文和<b>大字中文</b>；你说的话显示在右边。</p>
      <p>你第一次说话后，<b>点一下那条字幕上的标签</b>，标成「我」。系统就能分清谁是谁。</p>
      <p class="lecture-tip">「会议演讲」模式：适合听讲座、开会。可以点「主题」填会议主题，识别专业词会更准；结束后可以「导出全文」。</p>
      <p class="muted">不保存录音；刷新页面后记录清空。</p>
    </div>
  </main>

  <section id="suggest" class="hidden">
    <div class="suggest-head">
      <span>建议回答 <small class="muted">点一下可朗读</small></span>
      <span id="suggest-meta" class="muted"></span>
      <button id="suggest-refresh" class="ghost" title="重新生成">↻</button>
    </div>
    <div id="suggest-list"></div>
  </section>

  <nav id="phrases" aria-label="快捷短语"></nav>

  <div id="lecture-bar" class="hidden">
    <button id="zh-only">仅看中文</button>
    <button id="font-down" aria-label="字小一点">A−</button>
    <button id="font-up" aria-label="字大一点">A+</button>
    <button id="export">导出全文</button>
  </div>
  <button id="jump" class="jump hidden">↓ 最新</button>

  <footer>
    <button id="clear" class="ghost">清空</button>
    <button id="terms-btn" class="ghost">词表</button>
    <button id="toggle" class="primary big">开始</button>
    <div id="level" class="level"><div id="level-bar"></div></div>
  </footer>
  <div id="toast" class="toast hidden"></div>

  <dialog id="terms-dialog">
    <form method="dialog">
      <h3>常用词 / 易错词</h3>
      <p class="muted small">每行一个。识别时会优先往这些说法上靠；写成 <code>英文 = 中文</code> 还能指定翻译。下次点「开始」生效。</p>
      <textarea id="terms-text" rows="10" spellcheck="false" autocapitalize="off"
        placeholder="due on Monday&#10;night shift&#10;T&amp;T Supermarket&#10;OHIP = 安省医保&#10;MRI = 核磁共振"></textarea>
      <div class="dialog-actions">
        <button value="cancel" class="ghost">取消</button>
        <button id="terms-save" value="save" class="primary">保存</button>
      </div>
    </form>
  </dialog>
</div>
<script src="/static/app.js"></script>
</body>
</html>
